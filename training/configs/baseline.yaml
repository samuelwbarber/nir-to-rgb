project:
  name: nir2rgb
  experiment: phase1_unet_pix2pix
  output_dir: experiments

data:
  nir_dir: data/nir
  rgb_dir: data/rgb
  extensions: [.png, .jpg, .jpeg, .tif, .tiff]
  image_size: 256
  in_channels: 3
  out_channels: 3

split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
  scene_regex: null

augment:
  hflip: true
  rotate_max_deg: 10.0
  scale_min: 0.9
  scale_max: 1.15
  nir_brightness: 0.2
  nir_gamma_min: 0.8
  nir_gamma_max: 1.2

model:
  generator:
    type: unet
    base_channels: 64
    use_dropout: true
  discriminator:
    type: patchgan
    base_channels: 64
    n_layers: 3

loss:
  l1_weight: 100.0
  perceptual_weight: 10.0
  gan_weight: 1.0
  msssim_weight: 1.0
  perceptual_layers: [3, 8, 15, 22]
  gan_type: lsgan

optim:
  generator:
    lr: 0.0002
    betas: [0.5, 0.999]
  discriminator:
    lr: 0.0002
    betas: [0.5, 0.999]

train:
  batch_size: 16
  num_workers: 0
  epochs: 200
  amp: true
  log_interval: 50
  val_interval_epochs: 1
  save_interval_epochs: 10
  sample_count: 8
  resume: latest

eval:
  metrics: [psnr, ssim, lpips]
  lpips_net: alex

device: cuda
