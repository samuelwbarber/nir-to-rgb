project:
  name: kaist_thermal
  experiment: kaist_thermal_scratch_150
  output_dir: experiments
data:
  nir_dir: data/kaist-nir       # LWIR (thermal) treated as the 'nir' input
  rgb_dir: data/kaist-rgb       # visible RGB target
  mp_cache: null
  extensions:
  - .png
  - .jpg
  - .jpeg
  - .tif
  - .tiff
  image_size: 256
  in_channels: 3
  out_channels: 3
split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
  # only 5 scenes have data on the HF mirror (set00 V000/V001/V007/V008 + set05); per-scene split
  # would leave val empty, so fall back to per-frame random split (scenes leak across splits).
  scene_regex: null
augment:
  hflip: true
  rotate_max_deg: 10.0
  scale_min: 0.9
  scale_max: 1.15
  nir_brightness: 0.2
  nir_gamma_min: 0.8
  nir_gamma_max: 1.2
model:
  generator:
    type: nafnet
    width: 64
    enc_blk_nums:
    - 2
    - 2
    - 4
    - 8
    middle_blk_num: 12
    dec_blk_nums:
    - 2
    - 2
    - 2
    - 2
    dropout: 0.0
    global_residual: false
    output_tanh: true
  discriminator:
    type: patchgan
    base_channels: 64
    n_layers: 3
loss:
  l1_weight: 100.0
  perceptual_weight: 20.0
  gan_weight: 0.5
  msssim_weight: 3.0
  region_l1_boost: 1.0
  perceptual_layers:
  - 3
  - 8
  - 15
  - 22
  gan_type: lsgan
optim:
  generator:
    lr: 0.00005
    betas:
    - 0.9
    - 0.9
  discriminator:
    lr: 0.00005
    betas:
    - 0.5
    - 0.999
train:
  batch_size: 2              # 11 GB 2080 Ti - same as the T4 setup
  num_workers: 4
  epochs: 150
  amp: true
  log_interval: 50
  val_interval_epochs: 1
  save_interval_epochs: 5
  keep_last_checkpoints: 3
  sample_count: 8
  grad_clip: 1.0
  resume: null               # train from scratch as requested
  resume_mode: weights_only
eval:
  metrics:
  - psnr
  - ssim
  - lpips
  lpips_net: alex
device: cuda
