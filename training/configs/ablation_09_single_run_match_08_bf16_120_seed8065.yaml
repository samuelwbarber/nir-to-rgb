project:
  name: nir2rgb
  experiment: ablation_09_single_run_match_08_bf16_120_seed8065
  output_dir: experiments
data:
  nir_dir: data/nir
  rgb_dir: data/rgb
  mp_cache: null
  extensions:
    - .png
    - .jpg
    - .jpeg
    - .tif
    - .tiff
  image_size: 256
  in_channels: 3
  out_channels: 3
split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
  scene_regex: null
augment:
  hflip: true
  rotate_max_deg: 10.0
  scale_min: 0.9
  scale_max: 1.15
  nir_brightness: 0.2
  nir_gamma_min: 0.8
  nir_gamma_max: 1.2
model:
  generator:
    type: nafnet
    width: 64
    enc_blk_nums:
      - 2
      - 2
      - 4
      - 8
    middle_blk_num: 12
    dec_blk_nums:
      - 2
      - 2
      - 2
      - 2
    dropout: 0.0
    global_residual: false
    output_tanh: true
  discriminator:
    type: patchgan
    base_channels: 64
    n_layers: 3
loss:
  l1_weight: 20.0
  perceptual_weight: 0.0
  gan_weight: 0.0
  msssim_weight: 3.0
  region_l1_boost: 1.0
  perceptual_layers:
    - 3
    - 8
    - 15
    - 22
  gan_type: lsgan
  gan_warmup_epochs: 0
  feature_map_warmup_epochs: 25
  feature_map_input_size: 224
  feature_map_extractors:
    - name: dinov2_vits14
      weight: 30.0
    - name: clip_vitb32
      weight: 15.0
    - name: resnet50
      weight: 5.0
optim:
  generator:
    lr: 1.0e-4
    betas:
      - 0.9
      - 0.99
  discriminator:
    lr: 1.0e-4
    betas:
      - 0.5
      - 0.999
  lr_schedule:
    type: cosine
    warmup_epochs: 5
    min_lr: 1.0e-6
train:
  batch_size: 4
  num_workers: 6
  epochs: 120
  amp: bf16
  log_interval: 50
  val_interval_epochs: 1
  save_interval_epochs: 10
  keep_last_checkpoints: 3
  sample_count: 8
  grad_clip: 1.0
  ema_decay: 0.999
  resume: null
  resume_mode: full
  best_metric: val/clip_cos
  best_metric_mode: max
  seed: 8065
eval:
  metrics:
    - psnr
    - ssim
    - lpips
  lpips_net: alex
device: cuda
