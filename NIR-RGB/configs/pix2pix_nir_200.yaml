project:
  name: nir2rgb
  experiment: pix2pix_nir_200
  output_dir: experiments

data:
  nir_dir: data/nir
  rgb_dir: data/rgb
  mp_cache: null
  extensions:
  - .png
  - .jpg
  - .jpeg
  - .tif
  - .tiff
  image_size: 256
  in_channels: 3
  out_channels: 3

split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 8065
  scene_regex: null

augment:
  hflip: true
  rotate_max_deg: 10.0
  scale_min: 0.9
  scale_max: 1.15
  nir_brightness: 0.2
  nir_gamma_min: 0.8
  nir_gamma_max: 1.2

model:
  generator:
    type: unet
    base_channels: 64
    use_dropout: true
  discriminator:
    type: patchgan
    base_channels: 64
    n_layers: 3

loss:
  l1_weight: 100.0
  perceptual_weight: 0.0
  gan_weight: 1.0
  msssim_weight: 0.0
  region_l1_boost: 1.0
  perceptual_layers:
  - 3
  - 8
  - 15
  - 22
  gan_type: lsgan
  gan_warmup_epochs: 0
  feature_map_warmup_epochs: 0
  feature_map_input_size: 224
  feature_map_extractors: []

optim:
  generator:
    lr: 2.0e-4
    betas:
    - 0.5
    - 0.999
  discriminator:
    lr: 2.0e-4
    betas:
    - 0.5
    - 0.999

train:
  batch_size: 8
  num_workers: 6
  epochs: 200
  amp: false
  log_interval: 50
  val_interval_epochs: 1
  save_interval_epochs: 10
  keep_last_checkpoints: 3
  sample_count: 8
  grad_clip: 0.5
  resume: experiments/pix2pix_nir_200/checkpoints/latest.pth
  resume_mode: full
  best_metric: val/psnr
  best_metric_mode: max
  seed: 8065

eval:
  metrics:
  - psnr
  - ssim
  - lpips
  lpips_net: alex

device: cuda
